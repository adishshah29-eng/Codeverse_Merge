# /etc/nginx/sites-available/codeverse  (symlink into sites-enabled)
#
#   /          → React build (frontend/dist)
#   /phase1/   → React build, Phase 1 page
#   /phase2/   → React build, Phase 2 page
#   /api/      → FastAPI (Gunicorn on 127.0.0.1:8000), path kept as-is
#   /vendor/   → static game assets (built into frontend/dist/vendor)
#
# TLS terminates at Cloudflare; cloudflared forwards to http://localhost:80.
# Paths assume the repository is cloned to /opt/codeverse.

upstream codeverse_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name codeverse.is-a.dev localhost;

    root /opt/codeverse/frontend/dist;
    index index.html;

    # Real client IP from Cloudflare (cloudflared connects from localhost).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;        # largest request: ~100 KB of submitted code
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ── API ───────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://codeverse_api;      # no URI part: /api/... is forwarded unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 70s;               # code runs: 15 s + up to 20 s queue
        proxy_send_timeout 70s;
        add_header Cache-Control "no-store" always;
    }

    # ── Static game assets (iframes, CTF pages), part of the Vite build ──
    location /vendor/ {
        try_files $uri =404;
        expires 1h;
    }

    # ── Hashed build assets: cache forever ───────────────────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── The three pages (no-cache so new deploys show up immediately) ────
    location /phase1/ {
        try_files $uri $uri/ /phase1/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /phase2/ {
        try_files $uri $uri/ /phase2/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /phase1 { return 301 /phase1/; }
    location = /phase2 { return 301 /phase2/; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
